<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        html,body{
                        height:100%;
        }
        body{
            background-color: rgb(236, 239, 241);
            display:flex;
            justify-content: center;
            align-items: center;
        }
        main{
            border:15px solid  rgba(255,255,255,0.2);
                box-shadow:
        0 10px 30px rgba(0,0,0,0.1),
        0 1px 3px rgba(0,0,0,0.05);
            border-radius: 10px;
            background-color: rgb(207, 237, 229);
            height: 70%;
            width: 60%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
main h1{
    background: linear-gradient(90deg, red, blue);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    padding-bottom: 0px;
    font-size:50px;
}
main p{
    font-size: large;
        background: linear-gradient(90deg, rgb(33, 117, 220),rgb(210, 37, 37), rgb(11, 11, 232));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    padding:5px 7px;
}
main button{
    padding:10px;
    color: brown;
    font-size:large;
    background-color: aliceblue;
}

       @media (max-width: 640px) {
        main{
             margin: 0 10px; 
             height:80%;
             width:80%; 
             } 
             main h1{
                font-size:35px;
             }
        }
    </style>
        <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
    <main>
      <h1>Quote Generator</h1>
          <div class="lottie-container">
    <lottie-player
        src="https://lottie.host/d73fdda7-2680-4eae-8758-804a6607fed1/fUtGx2VzoB.json"
        background="transparent"
        speed="1"
         style="width:100px;height:100px"
        loop
        autoplay>
    </lottie-player>
    </div>
      <p id="quote-display">Click the below button to see the quote waiting for you today...</p>
    <lottie-player
        src="./dancer-woman.json"
        background="transparent"
        speed="1"
          style="width:100px;height:100px"
        loop
        autoplay>
    </lottie-player>
      <button id="get-quote-btn">Get a quote</button>
    </main>
<script>
  const getQuoteBtn = document.getElementById('get-quote-btn');
  const quoteDisplay = document.getElementById('quote-display');

  async function getQuote() {
    try {
      quoteDisplay.textContent = 'Loading...';

      const response = await fetch('https://dummyjson.com/quotes/random');
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }

      const quote = await response.json();

      quoteDisplay.textContent = `"${quote.quote}" — ${quote.author}`;
    } catch (error) {
      console.error('Error fetching quote:', error);
      quoteDisplay.textContent = 'Failed to load quote. Try again later.';
    }
  }

  getQuoteBtn.addEventListener('click', getQuote);
</script>
</body>
</html>
